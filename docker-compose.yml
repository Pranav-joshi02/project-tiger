services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: pench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pench}
      POSTGRES_USER: ${POSTGRES_USER:-pench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pench}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pench -d pench"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pench-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: pench-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-miniosecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: pench-minio-init
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/mc alias set local http://minio:9000 minio miniosecret; do
          echo 'Waiting for MinIO...'
          sleep 2
        done
        /usr/bin/mc mb --ignore-existing local/pench-raw
        /usr/bin/mc mb --ignore-existing local/pench-quarantine
        /usr/bin/mc mb --ignore-existing local/pench-processed
        echo 'MinIO buckets created successfully'
        exit 0

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pench-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg://pench:pench@postgres:5432/pench
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=miniosecret
      - MINIO_SECURE=false
      - APP_ENV=development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./storage:/srv/storage

  worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: pench-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg://pench:pench@postgres:5432/pench
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=miniosecret
      - MINIO_SECURE=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./storage:/srv/storage

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: pench-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
